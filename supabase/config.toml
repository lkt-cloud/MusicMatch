# Supabase project settings used by the CLI when deploying functions.
project_id = "music-match"

[functions.stripe-webhook]
# Stripe can't send a Supabase login token; the function checks Stripe's signature instead.
verify_jwt = false

[functions.push]
# Called by the database with a shared secret (x-hook-secret), not by signed-in people.
verify_jwt = false

[functions.calendar]
# Opened by calendar apps from an "Add to calendar" link; checks the booking's private token instead.
verify_jwt = false
